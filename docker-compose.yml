services:

  # ─── Demo App ──────────────────────────────────────────────────────────────
  # Application Node.js instrumentée avec prom-client
  demo-app:
    build: ./demo-app
    container_name: demo-app
    ports:
      - "3001:3001"
    restart: unless-stopped

  # ─── Traffic Generator ─────────────────────────────────────────────────────
  # Génère du trafic vers demo-app pour rendre les métriques visibles
  traffic-generator:
    build: ./traffic-generator
    container_name: traffic-generator
    environment:
      - TARGET_URL=http://demo-app:3001
      - INTERVAL_MS=1000
      - CONCURRENCY=2
      - ENABLE_RANDOM_INCIDENTS=false
      - RANDOM_INCIDENT_MIN_INTERVAL_MS=360000
      - RANDOM_INCIDENT_MAX_INTERVAL_MS=720000
      - RANDOM_INCIDENT_MIN_DURATION_MS=120000
      - RANDOM_INCIDENT_MAX_DURATION_MS=300000
      - TRAFFIC_SPIKE_MULTIPLIER=4
    depends_on:
      - demo-app
    restart: unless-stopped
