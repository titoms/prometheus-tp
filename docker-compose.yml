services:

  # ─── Demo App ──────────────────────────────────────────────────────────────
  # Application Node.js instrumentée avec prom-client
  demo-app:
    build: ./demo-app
    container_name: demo-app
    ports:
      - "3001:3001"
    restart: unless-stopped

  # ─── Traffic Generator ─────────────────────────────────────────────────────
  # Génère du trafic vers demo-app pour rendre les métriques visibles
  traffic-generator:
    build: ./traffic-generator
    container_name: traffic-generator
    environment:
      - TARGET_URL=http://demo-app:3001
      - INTERVAL_MS=1000
      - CONCURRENCY=2
      - ENABLE_RANDOM_INCIDENTS=false
      - RANDOM_INCIDENT_MIN_INTERVAL_MS=360000
      - RANDOM_INCIDENT_MAX_INTERVAL_MS=720000
      - RANDOM_INCIDENT_MIN_DURATION_MS=120000
      - RANDOM_INCIDENT_MAX_DURATION_MS=300000
      - TRAFFIC_SPIKE_MULTIPLIER=4
    depends_on:
      - demo-app
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle' # permet de recharger la config sans redémarrer le container
    depends_on:
      - demo-app
    restart: unless-stopped

  # Me permet de récupérer les métriques de la machine
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

  # Me permet de récupérer les métriques de nos conteneurs
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped

  # Me permet de créer un dashboard et visualiser certaines données a l'aide de PROMQL
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
